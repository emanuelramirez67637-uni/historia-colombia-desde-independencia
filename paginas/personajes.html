<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Personajes — Colombia a través del tiempo</title><link rel="stylesheet" href="../estilos/paginas.css"></head>
<body>
<main>
<section class="article-hero" style="--hero-image:url('../imagenes/historia/gaitan.jpg')">
  <p class="eyebrow" style="color:#e5c877">Galería biográfica</p>
  <h1>Personajes que transformaron Colombia</h1>
  <p class="lead">Selecciona una ficha para abrir una página independiente con su trayectoria, contexto y legado.</p>
</section>
<section style="padding:70px 5vw 100px">
  <div class="portrait-index" id="portrait-index"></div>
</section>
</main>
<script src="../datos/content.js"></script>
<script>
const index=document.querySelector('#portrait-index');
index.innerHTML=window.HISTORIA_CONTENT.people.map(person=>{
  const image=person.image ? `url('../${person.image}')` : 'linear-gradient(135deg,#315c78,#17191d)';
  return `<a class="portrait-card" style="background-image:linear-gradient(180deg,rgba(23,25,29,.05),rgba(23,25,29,.94)),${image}" href="personaje.html?nombre=${person.slug}">
    <span>${person.role}</span><h2>${person.name}</h2><p>${person.text}</p>
  </a>`;
}).join('');
</script>
</body>
</html>
